<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 549.8">
    <defs>
      <linearGradient id="kela-bg" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#FFF" />
        <stop offset="70%" stop-color="#FFF" />
        <stop offset="100%" stop-color="#fdb916" />
      </linearGradient>
    </defs>
    <style type="text/css">
     @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..400;1,300..400&amp;family=Montserrat:wght@700&amp;display=swap');
     .card {
      fill: url(#kela-bg);
      stroke: #fdb916;
      stroke-opacity: 0.5;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
     }
     foreignObject {
      position: relative;
     }
     p {
      color: #003580;
      font-family: 'Neue Haas', 'Hanken Grotesk', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      position: absolute;
      top: 50%;
      transform: translate(0, -50%);
     }
     .title {
      font-family: 'Loose Wide', Montserrat, 'Segoe UI', Garamond, Verdana, sans-serif;
      font-size: 24pt;
     }
     .hetu {
      font-family: 'Loose Wide', Montserrat, 'Segoe UI', Garamond, Verdana, sans-serif;
      font-size: 32pt;
     }
     .muodostettu {
      color: #0d0342;
      font-size: 18pt;
     }
    </style>
    <rect class="card" x="4" y="4" width="848" height="541.8" rx="31" ry="31" />
    <image x="50" y="50" width="192" height="62" href="https://alennusperuste.todiste.fi/img/Logo_KelaFpa.png" />
    <foreignObject x="50" y="175" width="748" height="50">
      <p xmlns="http://www.w3.org/1999/xhtml" class="title">Intyg om pension från Kela</p>
    </foreignObject>
    <foreignObject x="50" y="225" width="748" height="225">
      <p xmlns="http://www.w3.org/1999/xhtml" class="hetu">{{hetu}}</p>
    </foreignObject>
    <foreignObject x="50" y="450" width="748" height="80">
      <p xmlns="http://www.w3.org/1999/xhtml" class="muodostettu">{{muodostettu}}</p>
    </foreignObject>
   </svg>
